<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M&S Prime Benefit Solution | 법인 폐쇄몰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; -webkit-user-select: none; user-select: none; }
        @media print { body { display: none !important; } }
        .secure-blur { filter: blur(25px) !important; }
        @media (max-width: 1023px) { .mobile-pad { padding-bottom: 90px; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased mobile-pad" oncontextmenu="return false;">

    <!-- 1. 인증 게이트 -->
    <div id="auth-gate" class="fixed inset-0 bg-slate-950/95 z-50 flex items-center justify-center p-4">
        <div class="bg-white max-w-md w-full rounded-2xl shadow-2xl p-6 sm:p-8">
            <div class="text-center mb-6">
                <span class="bg-red-600 text-white font-extrabold text-xs px-2.5 py-1 rounded">KT M&S</span>
                <h2 class="text-2xl font-extrabold text-slate-900 mt-2">법인 제휴 임직원 인증</h2>
                <p class="text-xs text-slate-500 mt-1">제휴 법인명과 발급받은 보안 PASS를 입력하세요.</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">법인명 / 마스터 ID</label>
                    <input type="text" id="auth-corp" placeholder="법인명 또는 마스터 ID (jaeng2)" class="w-full bg-slate-50 border rounded-lg p-3 text-sm focus:ring-2 focus:ring-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">보안 PASS / 비밀번호</label>
                    <input type="password" id="auth-pass" placeholder="보안 PASS 입력 (123qwe)" class="w-full bg-slate-50 border rounded-lg p-3 text-sm focus:ring-2 focus:ring-red-500 outline-none">
                </div>

                <div id="auth-err" class="text-xs text-red-600 font-semibold hidden">
                    <i class="fa-solid fa-circle-exclamation mr-1"></i>인증 정보가 일치하지 않습니다.
                </div>

                <button type="button" onclick="executeLogin()" id="btn-login" class="w-full py-3.5 bg-red-600 hover:bg-red-700 active:bg-red-800 text-white font-bold rounded-xl text-sm shadow-md transition">
                    폐쇄몰 입장하기
                </button>
            </div>

            <div class="mt-5 pt-4 border-t text-center">
                <button type="button" onclick="toggleModal(true)" class="text-xs font-bold text-slate-700 hover:text-red-600 underline">
                    신규 법인 제휴 및 PASS 발급 신청
                </button>
            </div>
        </div>
    </div>

    <!-- 2. 신규 법인 신청 모달 -->
    <div id="apply-modal" class="fixed inset-0 bg-black/80 z-[60] hidden items-center justify-center p-4">
        <div class="bg-white max-w-lg w-full rounded-2xl shadow-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-base sm:text-lg font-bold text-slate-900">신규 법인 제휴 신청</h3>
                <button type="button" onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600 text-lg p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">신청 법인명</label>
                    <input type="text" id="req-corp" placeholder="예: KT CS" class="w-full bg-slate-50 border rounded-lg p-2.5 text-xs outline-none">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">담당자 성함</label>
                        <input type="text" id="req-name" placeholder="홍길동" class="w-full bg-slate-50 border rounded-lg p-2.5 text-xs outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">담당자 연락처</label>
                        <input type="tel" id="req-phone" placeholder="010-0000-0000" class="w-full bg-slate-50 border rounded-lg p-2.5 text-xs outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">회사 이메일</label>
                    <input type="email" id="req-email" placeholder="example@company.com" class="w-full bg-slate-50 border rounded-lg p-2.5 text-xs outline-none">
                </div>
                <button type="button" onclick="submitApply()" id="btn-apply" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs shadow-md">
                    제휴 승인 요청 등록
                </button>
            </div>
        </div>
    </div>

    <!-- 3. 메인 콘텐츠 -->
    <div id="main-content">
        <!-- Header -->
        <header class="bg-white border-b sticky top-0 z-40 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 h-14 sm:h-16 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <span class="bg-red-600 text-white font-extrabold text-[10px] sm:text-xs px-2 py-0.5 rounded">KT M&S</span>
                    <span class="text-base sm:text-lg font-extrabold tracking-tight">Prime Benefit <span class="text-red-600">Solution</span></span>
                </div>
                <div class="flex items-center space-x-2">
                    <span id="price-sync-status" class="text-[11px] font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-0.5 rounded-full hidden sm:inline-block">시트 연동됨</span>
                    <span id="logged-corp-badge" class="text-xs font-bold text-red-600 bg-red-50 border border-red-200 px-2.5 py-0.5 rounded-full">인증 법인: -</span>
                    <button type="button" onclick="logout()" class="text-xs text-slate-400 hover:text-slate-700 p-1">로그아웃</button>
                </div>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="max-w-6xl mx-auto px-3 sm:px-4 py-5 sm:py-8">
            <!-- 탭 전환 -->
            <div class="grid grid-cols-3 gap-1 border bg-white p-1 rounded-xl shadow-sm mb-6">
                <button type="button" onclick="switchTab('employee')" id="tab-employee" class="py-2.5 sm:py-3 text-center font-bold text-xs sm:text-sm rounded-lg bg-red-600 text-white shadow">임직원 휴대폰</button>
                <button type="button" onclick="switchTab('family')" id="tab-family" class="py-2.5 sm:py-3 text-center font-semibold text-xs sm:text-sm rounded-lg text-slate-500 hover:text-slate-900">가족·지인 특가</button>
                <button type="button" onclick="switchTab('home')" id="tab-home" class="py-2.5 sm:py-3 text-center font-semibold text-xs sm:text-sm rounded-lg text-slate-500 hover:text-slate-900">인터넷+TV</button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <!-- 좌측 설정 영역 -->
                <div class="lg:col-span-7 bg-white p-5 sm:p-7 rounded-2xl border shadow-sm space-y-5">
                    <!-- Tab 1: 임직원 -->
                    <div id="content-employee" class="tab-content space-y-4">
                        <h2 class="text-base font-bold text-slate-900 border-b pb-2">임직원 본인 전용 견적</h2>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">단말기 선택</label>
                            <select id="emp-device" class="w-full bg-slate-50 border rounded-lg p-2.5 text-xs outline-none" onchange="calcEmp()"></select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">가입 유형</label>
                            <div class="grid grid-cols-3 gap-1.5">
                                <button type="button" onclick="setJoin('emp','mnp')" id="emp-type-mnp" class="py-2 border-2 border-red-600 bg-red-50 text-red-700 font-bold text-xs rounded-lg">번호이동</button>
                                <button type="button" onclick="setJoin('emp','chg')" id="emp-type-chg" class="py-2 border bg-white text-slate-600 font-bold text-xs rounded-lg">기기변경</button>
                                <button type="button" onclick="setJoin('emp','new')" id="emp-type-new" class="py-2 border bg-white text-slate-600 font-bold text-xs rounded-lg">신규가입</button>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">요금제 선택</label>
                            <select id="emp-plan" class="w-full bg-slate-50 border rounded-lg p-2.5 text-xs outline-none" onchange="calcEmp()"></select>
                        </div>
                    </div>

                    <!-- Tab 2: 가족 -->
                    <div id="content-family" class="tab-content space-y-4 hidden">
                        <h2 class="text-base font-bold text-slate-900 border-b pb-2">가족·지인 추천 견적</h2>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">단말기 선택</label>
                            <select id="fam-device" class="w-full bg-slate-50 border rounded-lg p-2.5 text-xs outline-none" onchange="calcFam()"></select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">가입 유형</label>
                            <div class="grid grid-cols-3 gap-1.5">
                                <button type="button" onclick="setJoin('fam','mnp')" id="fam-type-mnp" class="py-2 border-2 border-red-600 bg-red-50 text-red-700 font-bold text-xs rounded-lg">번호이동</button>
                                <button type="button" onclick="setJoin('fam','chg')" id="fam-type-chg" class="py-2 border bg-white text-slate-600 font-bold text-xs rounded-lg">기기변경</button>
                                <button type="button" onclick="setJoin('fam','new')" id="fam-type-new" class="py-2 border bg-white text-slate-600 font-bold text-xs rounded-lg">신규가입</button>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">요금제 선택</label>
                            <select id="fam-plan" class="w-full bg-slate-50 border rounded-lg p-2.5 text-xs outline-none" onchange="calcFam()"></select>
                        </div>
                    </div>

                    <!-- Tab 3: 홈결합 -->
                    <div id="content-home" class="tab-content space-y-4 hidden">
                        <h2 class="text-base font-bold text-slate-900 border-b pb-2">인터넷 + IPTV 결합 견적</h2>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">인터넷 속도</label>
                            <select id="home-speed" class="w-full bg-slate-50 border rounded-lg p-2.5 text-xs outline-none" onchange="calcHome()"></select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">IPTV 상품</label>
                            <select id="home-tv" class="w-full bg-slate-50 border rounded-lg p-2.5 text-xs outline-none" onchange="calcHome()"></select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">셋톱박스</label>
                                <select id="home-settop" class="w-full bg-slate-50 border rounded-lg p-2 text-xs outline-none" onchange="calcHome()"></select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">와이파이</label>
                                <select id="home-wifi" class="w-full bg-slate-50 border rounded-lg p-2 text-xs outline-none" onchange="calcHome()"></select>
                            </div>
                        </div>
                    </div>

                    <!-- 신청 폼 -->
                    <div class="mt-6 pt-5 border-t space-y-3">
                        <h3 class="text-xs font-bold text-slate-800"><i class="fa-solid fa-file-signature text-red-600 mr-1"></i>상담 및 견적서 신청</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <input type="text" id="cust-name" placeholder="신청자 성함" class="bg-slate-50 border rounded-lg p-2.5 text-xs outline-none">
                            <input type="tel" id="cust-phone" placeholder="연락처 (010-0000-0000)" class="bg-slate-50 border rounded-lg p-2.5 text-xs outline-none">
                        </div>
                        <button type="button" onclick="submitLead()" id="btn-lead" class="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-extrabold rounded-xl text-xs sm:text-sm shadow transition">
                            공식 견적서 발송 및 상담 신청
                        </button>
                    </div>
                </div>

                <!-- 우측 결과 패널 (PC 고정) -->
                <div class="lg:col-span-5">
                    <div class="bg-slate-900 text-white p-5 sm:p-6 rounded-2xl lg:sticky lg:top-24 border border-slate-800 shadow-xl space-y-4">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                            <span class="text-xs font-bold text-red-400">견적 산출 내역</span>
                            <span class="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded border border-slate-700">VAT 포함</span>
                        </div>
                        <div class="space-y-2 text-xs">
                            <div class="flex justify-between text-slate-300">
                                <span>선택 상품</span>
                                <span id="out-name" class="font-bold text-white max-w-[180px] truncate text-right">-</span>
                            </div>
                            <div class="flex justify-between text-slate-300">
                                <span>가입 조건</span>
                                <span id="out-cond" class="text-slate-200 text-right">-</span>
                            </div>
                            <div class="flex justify-between text-red-400 font-bold">
                                <span>총 할인/지원금</span>
                                <span id="out-disc">- 0 원</span>
                            </div>
                            <div class="pt-3 border-t border-slate-800 flex justify-between items-end">
                                <div>
                                    <p class="text-[11px] text-slate-400">최종 체감 월 통신료</p>
                                    <p class="text-2xl font-extrabold text-white" id="out-price">0 원</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 모바일 하단 바 -->
    <div class="lg:hidden fixed bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-800 px-4 py-3 z-30 flex items-center justify-between">
        <div>
            <span class="text-[10px] text-slate-400 block">체감 월 납부액</span>
            <span id="mobile-price" class="text-base font-extrabold text-white">0 원</span>
        </div>
        <button type="button" onclick="document.getElementById('cust-name').scrollIntoView({behavior:'smooth'})" class="bg-red-600 text-white font-bold text-xs px-4 py-2 rounded-lg">
            신청서 작성
        </button>
    </div>

    <!-- 스크립트 -->
    <script>
        const APPS_URL = "https://script.google.com/macros/s/AKfycbyMkt2f6ed9kub5W6rBMY-Jg1dsimfOy7ACbwv9aIoKP8sBd6JNg6VcSP3S6kvBxiHa/exec";
        
        let DB = {
            devices: {
                "S24U": { name: "갤럭시 S24 울트라", price: 1500000, mnp: 650000, chg: 500000, new: 550000 },
                "IP16PRO": { name: "아이폰 16 Pro", price: 1300000, mnp: 550000, chg: 450000, new: 480000 },
                "S24": { name: "갤럭시 S24", price: 900000, mnp: 500000, chg: 400000, new: 420000 },
                "ZFLIP6": { name: "갤럭시 Z플립6", price: 1300000, mnp: 550000, chg: 450000, new: 480000 }
            },
            plans: [
                { name: "초이스 프리미엄", price: 110000 },
                { name: "초이스 스페셜", price: 90000 },
                { name: "베이직", price: 69000 }
            ],
            internet: [
                { name: "인터넷 베이직 500M", price: 33000 },
                { name: "인터넷 에센스 1G", price: 38500 }
            ],
            iptv: [
                { name: "지니TV 베이직", price: 12100 },
                { name: "지니TV 모든G", price: 16500 }
            ],
            settop: [
                { name: "지니셋탑A", price: 3300 },
                { name: "지니셋탑4", price: 4400 }
            ],
            wifi: [
                { name: "GiGA WiFi", price: 1100 }
            ]
        };

        let curTab = 'employee', empType = 'mnp', famType = 'mnp', finalWon = 0, detailText = '';

        function fmt(n) { return new Intl.NumberFormat('ko-KR').format(Math.round(n)); }

        // 로그인 실행
        async function executeLogin() {
            const c = document.getElementById('auth-corp').value.trim();
            const p = document.getElementById('auth-pass').value.trim();
            const err = document.getElementById('auth-err');
            const btn = document.getElementById('btn-login');

            // 마스터 계정 즉각 승인 (jaeng2 / 123qwe)
            if (c === 'jaeng2' && p === '123qwe') {
                sessionStorage.setItem('AUTH_CORP', 'KT M&S 마스터 관리자');
                const gate = document.getElementById('auth-gate');
                gate.style.setProperty('display', 'none', 'important');
                document.getElementById('logged-corp-badge').innerText = '관리자: jaeng2';
                calcEmp();
                return;
            }

            btn.innerText = "확인 중...";
            btn.disabled = true;
            err.classList.add('hidden');

            try {
                const res = await fetch(APPS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "VERIFY_CORP", corp: c, pass: p })
                });
                const data = await res.json();
                if (data.success) {
                    sessionStorage.setItem('AUTH_CORP', c);
                    const gate = document.getElementById('auth-gate');
                    gate.style.setProperty('display', 'none', 'important');
                    document.getElementById('logged-corp-badge').innerText = `인증: ${c}`;
                    calcEmp();
                } else {
                    err.classList.remove('hidden');
                }
            } catch (e) {
                alert("인증 오류가 발생했습니다.");
            } finally {
                btn.innerText = "폐쇄몰 입장하기";
                btn.disabled = false;
            }
        }

        function logout() { sessionStorage.removeItem('AUTH_CORP'); location.reload(); }
        function toggleModal(s) { 
            const m = document.getElementById('apply-modal');
            m.style.display = s ? 'flex' : 'none';
            m.classList.toggle('hidden', !s);
        }

        // 탭 전환
        function switchTab(t) {
            curTab = t;
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`content-${t}`).classList.remove('hidden');
            ['employee', 'family', 'home'].forEach(k => {
                const b = document.getElementById(`tab-${k}`);
                b.className = k === t ? "py-2.5 sm:py-3 text-center font-bold text-xs sm:text-sm rounded-lg bg-red-600 text-white shadow" : "py-2.5 sm:py-3 text-center font-semibold text-xs sm:text-sm rounded-lg text-slate-500 hover:text-slate-900";
            });
            if (t === 'employee') calcEmp();
            if (t === 'family') calcFam();
            if (t === 'home') calcHome();
        }

        function setJoin(target, type) {
            if (target === 'emp') empType = type; else famType = type;
            ['mnp', 'chg', 'new'].forEach(k => {
                const b = document.getElementById(`${target}-type-${k}`);
                b.className = k === type ? "py-2 border-2 border-red-600 bg-red-50 text-red-700 font-bold text-xs rounded-lg" : "py-2 border bg-white text-slate-600 font-bold text-xs rounded-lg";
            });
            if (target === 'emp') calcEmp(); else calcFam();
        }

        function calcEmp() {
            const devKey = document.getElementById('emp-device').value;
            const planVal = Number(document.getElementById('emp-plan').value);
            const dev = DB.devices[devKey];
            if (!dev) return;
            const sub = dev[empType] + 100000;
            const prin = Math.max(0, dev.price - sub);
            const devM = (prin * 1.059) / 24;
            finalWon = Math.round(devM + planVal);
            detailText = `[임직원] ${dev.name} | ${empType.toUpperCase()} | 월 ${fmt(planVal)}원`;
            renderOut(dev.name, `${empType === 'mnp'?'번호이동':(empType==='chg'?'기기변경':'신규')}`, sub, finalWon);
        }

        function calcFam() {
            const devKey = document.getElementById('fam-device').value;
            const planVal = Number(document.getElementById('fam-plan').value);
            const dev = DB.devices[devKey];
            if (!dev) return;
            const sub = dev[famType];
            const prin = Math.max(0, dev.price - sub);
            const devM = (prin * 1.059) / 24;
            finalWon = Math.round(devM + planVal);
            detailText = `[가족] ${dev.name} | ${famType.toUpperCase()} | 월 ${fmt(planVal)}원`;
            renderOut(dev.name, `${famType === 'mnp'?'번호이동':(famType==='chg'?'기기변경':'신규')}`, sub, finalWon);
        }

        function calcHome() {
            const s = Number(document.getElementById('home-speed').value);
            const t = Number(document.getElementById('home-tv').value);
            const st = Number(document.getElementById('home-settop').value);
            const w = Number(document.getElementById('home-wifi').value);
            const raw = s + t + st + w;
            finalWon = raw - 11000;
            detailText = `[홈결합] 인터넷+TV+셋톱+WiFi`;
            renderOut("인터넷+TV 결합", "3년 약정 결합", 11000, finalWon);
        }

        function renderOut(n, c, d, p) {
            document.getElementById('out-name').innerText = n;
            document.getElementById('out-cond').innerText = c;
            document.getElementById('out-disc').innerText = `- ${fmt(d)} 원`;
            document.getElementById('out-price').innerText = `${fmt(p)} 원/월`;
            const mp = document.getElementById('mobile-price');
            if (mp) mp.innerText = `${fmt(p)} 원/월`;
        }

        // 제휴 신청 전송
        async function submitApply() {
            const btn = document.getElementById('btn-apply');
            const corp = document.getElementById('req-corp').value.trim();
            const name = document.getElementById('req-name').value.trim();
            const phone = document.getElementById('req-phone').value.trim();
            const email = document.getElementById('req-email').value.trim();

            if (!corp || !name || !phone) { alert("모든 항목을 입력하세요."); return; }
            btn.innerText = "전송 중..."; btn.disabled = true;

            try {
                await fetch(APPS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "SUBMIT_APPLY", corp, name, phone, email })
                });
                alert(`신청 완료: ${corp}\n검토 후 연락처로 PASS를 안내해 드립니다.`);
                toggleModal(false);
            } catch (e) {
                alert("전송 실패");
            } finally {
                btn.innerText = "제휴 승인 요청 등록"; btn.disabled = false;
            }
        }

        // 견적 신청 전송
        async function submitLead() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const btn = document.getElementById('btn-lead');
            if (!name || !phone) { alert("성함과 연락처를 입력하세요."); return; }

            btn.innerText = "전송 중..."; btn.disabled = true;
            try {
                await fetch(APPS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: "SUBMIT_LEAD",
                        corp: sessionStorage.getItem('AUTH_CORP') || "미지정",
                        category: curTab, name, phone,
                        planDetails: detailText,
                        price: `${fmt(finalWon)}원/월`
                    })
                });
                alert(`견적 신청 완료: ${name} 고객님`);
                document.getElementById('cust-name').value = '';
                document.getElementById('cust-phone').value = '';
            } catch (e) {
                alert("전송 중 오류가 발생했습니다.");
            } finally {
                btn.innerText = "공식 견적서 발송 및 상담 신청"; btn.disabled = false;
            }
        }

        function initUI() {
            const dSel = document.getElementById('emp-device'), fdSel = document.getElementById('fam-device');
            dSel.innerHTML = ''; fdSel.innerHTML = '';
            for (let k in DB.devices) {
                dSel.add(new Option(DB.devices[k].name, k));
                fdSel.add(new Option(DB.devices[k].name, k));
            }
            const pSel = document.getElementById('emp-plan'), fpSel = document.getElementById('fam-plan');
            pSel.innerHTML = ''; fpSel.innerHTML = '';
            DB.plans.forEach(p => {
                pSel.add(new Option(`${p.name} (월 ${fmt(p.price)}원)`, p.price));
                fpSel.add(new Option(`${p.name} (월 ${fmt(p.price)}원)`, p.price));
            });
            const sSel = document.getElementById('home-speed');
            sSel.innerHTML = ''; DB.internet.forEach(i => sSel.add(new Option(i.name, i.price)));
            const tvSel = document.getElementById('home-tv');
            tvSel.innerHTML = ''; DB.iptv.forEach(t => tvSel.add(new Option(t.name, t.price)));
            const stSel = document.getElementById('home-settop');
            stSel.innerHTML = ''; DB.settop.forEach(s => stSel.add(new Option(s.name, s.price)));
            const wfSel = document.getElementById('home-wifi');
            wfSel.innerHTML = ''; DB.wifi.forEach(w => wfSel.add(new Option(w.name, w.price)));

            calcEmp();
        }

        window.onload = function() {
            initUI();
            const saved = sessionStorage.getItem('AUTH_CORP');
            if (saved) {
                const gate = document.getElementById('auth-gate');
                gate.style.setProperty('display', 'none', 'important');
                document.getElementById('logged-corp-badge').innerText = saved.includes('마스터') ? '관리자: jaeng2' : `인증: ${saved}`;
            }
        };
    </script>
</body>
</html>
